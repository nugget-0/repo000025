<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wyspr — anonymous messages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--y:#fff;--y2:#ff5f6d;--ink:#111;--card:#fff;--soft:#f4f4f4;--mute:#666;--red:#e0302e}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#ec1187 0%,#ff5f6d 50%,#ffa94d 100%) fixed;color:var(--ink);font:16px/1.5 Rubik,system-ui,sans-serif}
.logo,#who{color:#fff}
#who button.ghost{color:#fff;border-color:#fff}
.card{box-shadow:0 12px 30px rgba(0,0,0,.18)!important;border:0!important}
.tabs>button:not(.on){color:#fff!important;border-color:#fff}
.card .tabs>button:not(.on){color:var(--ink)!important;border-color:var(--ink)}
.msg{border-color:#ddd!important}
.bubble{background:#111;color:#fff}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.logo{font-weight:800;font-size:30px;letter-spacing:-1px}
.logo span{background:#111;color:#fff;padding:0 8px;border-radius:10px;margin-left:4px}
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 6px 0 var(--ink);border:3px solid var(--ink);margin-bottom:16px}
h2{margin:0 0 10px;font-size:22px;line-height:1.15}
.bubble{background:var(--ink);color:var(--y);border-radius:18px 18px 18px 4px;padding:16px 18px;font-weight:600;font-size:19px;margin-bottom:12px;overflow-wrap:anywhere}
input,textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:2px solid var(--ink);border-radius:14px;background:var(--soft);color:var(--ink);margin-bottom:10px}
textarea{min-height:120px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--y2);outline-offset:2px}
button{font:inherit;font-weight:600;min-height:44px;padding:10px 18px;border-radius:14px;border:2px solid var(--ink);background:var(--ink);color:var(--y);cursor:pointer}
button.ghost{background:transparent;color:var(--ink)}
button.small{min-height:36px;padding:6px 12px;font-size:14px}
button.danger{background:transparent;color:var(--red);border-color:var(--red)}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1}
.tabs button:not(.on){background:transparent;color:var(--ink)}
.msg{background:var(--soft);border:2px solid var(--ink);border-radius:16px;padding:14px;margin-bottom:12px}
.msg .text{font-size:18px;font-weight:600;overflow-wrap:anywhere;margin-bottom:6px}
.meta{color:var(--mute);font-size:14px;margin-bottom:8px}
.reply{border-left:4px solid var(--y2);padding:4px 10px;margin:8px 0;overflow-wrap:anywhere}
.link{display:flex;gap:8px}
.link input{margin:0;font-size:14px}
.check{display:flex;gap:10px;align-items:center;margin:4px 0 14px;font-weight:600}
.check input{width:22px;height:22px;margin:0;accent-color:var(--ink)}
.err{color:var(--red);font-weight:600;min-height:1.5em;margin:4px 0}
.ok{color:#18794e;font-weight:600}
.empty{text-align:center;color:var(--mute);padding:20px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--y);padding:12px 18px;border-radius:14px;font-weight:600;display:none;z-index:9}
.note{font-size:14px;color:var(--mute)}
.av{width:var(--s,36px);height:var(--s,36px);border-radius:50%;object-fit:cover;flex:none;display:inline-grid;place-items:center;background:linear-gradient(135deg,#ec1187,#ffa94d);color:#fff;font-weight:800;font-size:calc(var(--s,36px)*.45);vertical-align:middle}
.who-av{display:flex;align-items:center;gap:8px}
.prof{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.prof .av{cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{min-height:34px;padding:5px 11px;font-size:13px;font-weight:600;background:var(--soft);color:var(--ink);border:1.5px solid #ddd;border-radius:999px}
.chips button:hover{border-color:var(--ink)}
.badge{display:inline-block;min-width:22px;padding:0 7px;margin-left:6px;border-radius:999px;background:var(--red);color:#fff;font-size:13px;line-height:22px}
.mile .card{animation:none}.mile-num{font-size:84px;font-weight:800;line-height:1;background:linear-gradient(135deg,#ec1187,#ffa94d);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
@media(prefers-reduced-motion:no-preference){.mile-num{animation:bump .6s cubic-bezier(.3,1.6,.5,1)}@keyframes bump{from{transform:scale(.3)}}}
.own{border:3px solid #111!important}
.receipt{font-size:13px;font-weight:600;color:var(--mute);margin:-4px 0 6px}.receipt.is-seen{color:#1a8f5a}
.hid{padding:8px 12px!important;opacity:.75}
.hid-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.hid-toggle{width:100%;margin:4px 0 12px;background:rgba(255,255,255,.85)!important}
.tools{justify-content:flex-end;margin-bottom:10px}.tools button{background:rgba(255,255,255,.85)}
.pw{margin-top:14px}.pw summary{cursor:pointer;font-weight:600;color:var(--mute);font-size:14px}
.guessed{background:#fff3c4;border-radius:12px;padding:8px 12px;font-weight:600;margin-bottom:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal .card{width:min(420px,100%);max-height:94vh;overflow:auto}
.new{border-color:var(--y2)!important;box-shadow:0 0 0 2px var(--y2)}
.send-head{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:12px}
.wrap.wide{max-width:980px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:14px}
.stats div{background:var(--soft);border-radius:14px;padding:12px}
.stats b{display:block;font-size:26px;line-height:1.1}.stats span{color:var(--mute);font-size:14px}
.scroll{overflow-x:auto}
.at{width:100%;border-collapse:collapse;font-size:15px}
.at th{text-align:left;color:var(--mute);font-weight:600;padding:8px;border-bottom:2px solid #eee;white-space:nowrap}
.at td{padding:10px 8px;border-bottom:1px solid #eee;vertical-align:top}
.at td.n{text-align:right}
.tag{background:var(--red);color:#fff;border-radius:8px;padding:1px 7px;font-size:12px;font-weight:600}
@media(prefers-reduced-motion:no-preference){.card{animation:pop .25s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:0}}}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo">wyspr<span>?</span></div><div id="who" class="row"></div></header>
  <main id="app"></main>
</div>
<div class="toast" id="toast"></div>
<script>
{
const API = window.WYSPR_API || (location.hostname.endsWith('neon.tech') ? '' : 'https://br-empty-fog-az0bothu-wyspr.compute.c-3.ap-southeast-1.aws.neon.tech');
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token = null; try { token = localStorage.getItem('wyspr_token'); } catch {}
let me = null, tab = 'inbox', poll = null;

function setToken(t){ token = t; try { t ? localStorage.setItem('wyspr_token', t) : localStorage.removeItem('wyspr_token'); } catch {} }
function toast(t){ const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = 'none', 2200); }
const av = (src, name, s = 36) => src ? `<img class="av" style="--s:${s}px" src="${esc(src)}" alt="">`
  : `<span class="av" style="--s:${s}px">${esc((name || '?')[0].toUpperCase())}</span>`;
const PROMPTS = ['send me anonymous messages!', 'ask me anything', 'rate me 1–10 (be honest)', 'what was your first impression of me?',
  'confess something 👀', 'tell me a secret', "what's one thing you'd change about me?", 'who do you think I have a crush on?',
  'describe me in 3 words', 'never have I ever…', 'what song reminds you of me?', 'truth or dare?'];
function setUnread(n, r = me.replies || 0){
  me.unread = n; me.replies = r;
  const b = $('#t-in'); if (b) b.innerHTML = 'Inbox' + (n ? `<span class="badge">${n}</span>` : '');
  const s2 = $('#t-sent'); if (s2) s2.innerHTML = 'Sent' + (r ? `<span class="badge">${r}</span>` : '');
  document.title = (n + r ? `(${n + r}) ` : '') + 'Wyspr — anonymous messages';
}
// milestones: celebrate 1st, 5th, 10th, 25th... message once each
const MILESTONES = [1, 5, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000, 10000];
const MILESTONE_TEXT = { 1: 'Your first message! 🎉', 5: '5 messages! People are talking 👀', 10: '10 messages! You\'re popular 🔥',
  25: '25 messages! Main character energy ✨', 50: '50 messages!! 🤯', 100: '100 MESSAGES 💯' };
async function checkMilestone(){
  const hit = MILESTONES.filter(n => n <= (me.received || 0) && n > (me.milestone || 0)).pop();
  if (!hit || document.querySelector('.mile')) return;
  me.milestone = hit;
  try { await call('milestone', { n: hit }); } catch {}
  document.body.insertAdjacentHTML('beforeend', `<div class="modal mile"><div class="card" style="margin:0;text-align:center">
    <div class="mile-num">${hit}</div><h2>${esc(MILESTONE_TEXT[hit] || hit + ' messages! Legend status 👑')}</h2>
    <p class="note">${hit === 1 ? 'Someone sent you a message. Go see what they said 👀' : 'Share your link again to keep them coming.'}</p>
    <div class="row" style="justify-content:center"><button id="mile-x">Let's go</button></div></div></div>`);
  $('#mile-x').onclick = () => document.querySelector('.mile').remove();
}
// shrink a picked image to a small square JPEG in the browser
function shrinkImage(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const S = 160, c = document.createElement('canvas'); c.width = c.height = S;
      const m = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82)); };
    img.onerror = () => rej(new Error("Couldn't read that picture"));
    img.src = url;
  });
}
function ago(ts){ const s = (Date.now() - new Date(ts)) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s/60) + 'm ago'; if (s < 86400) return Math.floor(s/3600) + 'h ago'; return Math.floor(s/86400) + 'd ago'; }

async function call(path, body){
  const r = await fetch(API + '/api/' + path, {
    method: body ? 'POST' : 'GET',
    headers: { 'content-type': 'application/json', ...(token ? { authorization: 'Bearer ' + token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const d = await r.json().catch(() => ({ error: 'Bad response' }));
  if (r.status === 401 && token && path !== 'login') { setToken(null); me = null; }
  if (!r.ok) throw new Error(d.error || 'Something went wrong');
  return d;
}

function renderWho(){
  $('#who').innerHTML = me
    ? `<span class="who-av">${av(me.avatar, me.username, 30)}@${esc(me.username)}</span>${me.admin ? '<button class="small ghost" id="adm">Admin</button>' : ''}<button class="small ghost" id="out">Log out</button>`
    : '';
  if (me && me.admin) $('#adm').onclick = () => { history.pushState(null, '', '/admin'); adminPage(); };
  if (me) $('#out').onclick = async () => { try { await call('logout', {}); } catch {} setToken(null); me = null; location.href = '/'; };
}

// ---------- sign in / sign up ----------
function authForm(title, after){
  let mode = 'signup';
  const draw = () => {
    app.innerHTML = `<div class="card"><h2>${esc(title)}</h2>
      <div class="tabs"><button id="m-up" class="${mode==='signup'?'on':''}">Sign up</button><button id="m-in" class="${mode==='login'?'on':''}">Log in</button></div>
      <form id="af"><input id="u" placeholder="username" autocomplete="username" autocapitalize="none">
      <input id="p" type="password" placeholder="password" autocomplete="${mode==='signup'?'new-password':'current-password'}">
      <div class="err" id="e"></div><button style="width:100%">${mode==='signup'?'Create account':'Log in'}</button></form>
      ${mode === 'login' ? '<p class="note" style="margin-top:10px">Forgot your password? Ask the Wyspr admin to reset it — they\'ll give you a temporary one.</p>' : ''}
      <p class="note">Messages you get show up as anonymous. Your account lets you block people, and lets senders choose to reveal themselves.</p></div>`;
    $('#m-up').onclick = () => { mode = 'signup'; draw(); };
    $('#m-in').onclick = () => { mode = 'login'; draw(); };
    $('#af').onsubmit = async e => {
      e.preventDefault(); $('#e').textContent = '';
      try { const d = await call(mode, { username: $('#u').value, password: $('#p').value });
        setToken(d.token); me = await call('me'); renderWho(); after(); }
      catch (x) { $('#e').textContent = x.message; }
    };
  };
  draw();
}

// ---------- send page: /u/username ----------
async function sendPage(name){
  let prof;
  try { prof = await call('profile/' + encodeURIComponent(name)); }
  catch (x) { app.innerHTML = `<div class="card"><h2>${esc(x.message)}</h2><a href="/">Go home</a></div>`; return; }
  if (!me) { authForm(`Sign in to message @${prof.username}`, () => sendPage(name)); return; }
  let draft = ''; try { draft = sessionStorage.getItem('wyspr_draft_' + name) || ''; } catch {}
  app.innerHTML = `<div class="card"><div class="send-head">${av(prof.avatar, prof.username, 72)}<b>@${esc(prof.username)}</b></div>
    <div class="bubble">${esc(prof.prompt)}</div>
    <form id="sf"><textarea id="t" maxlength="500" placeholder="send me anonymous messages...">${esc(draft)}</textarea>
    <label class="check"><input type="checkbox" id="rv"> Let them know it's me (@${esc(me.username)})</label>
    <div class="err" id="e"></div><button style="width:100%" id="sb">Send!</button></form>
    <p class="note">Anonymous to them unless you tick the box. You can still reveal later from your Sent tab.</p></div>
    <div id="after"></div>`;
  $('#t').oninput = () => { try { sessionStorage.setItem('wyspr_draft_' + name, $('#t').value); } catch {} };
  $('#sf').onsubmit = async e => {
    e.preventDefault(); $('#e').textContent = ''; $('#sb').disabled = true;
    try { await call('send', { to: name, body: $('#t').value, reveal: $('#rv').checked });
      try { sessionStorage.removeItem('wyspr_draft_' + name); } catch {}
      $('#t').value = ''; $('#rv').checked = false; toast('Sent! 🤫'); wantYourOwn(); }
    catch (x) { $('#e').textContent = x.message; }
    $('#sb').disabled = false;
  };
}

// after sending: push the sender to share their own link
function wantYourOwn(){
  const link = location.origin + '/u/' + me.username;
  $('#after').innerHTML = `<div class="card own"><h2>Sent 🤫 Now it's your turn</h2>
    <p style="margin:0 0 12px">Want to know what people really think of <b>you</b>? Post your own link and get anonymous messages too.</p>
    <div class="link"><input readonly value="${esc(link)}" id="own-l"><button id="own-c">Copy</button></div>
    <div class="row" style="margin-top:10px">${navigator.share ? '<button id="own-s">Share my link</button>' : ''}<a href="/"><button class="ghost">Open my inbox</button></a></div></div>`;
  $('#own-c').onclick = async () => { try { await navigator.clipboard.writeText(link); toast('Link copied — go post it!'); } catch { $('#own-l').select(); } };
  if ($('#own-s')) $('#own-s').onclick = async () => { try { await navigator.share({ text: 'send me anonymous messages 👀', url: link }); } catch {} };
  $('#after').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ---------- home: link, prompt, inbox, sent ----------
function home(){
  const link = location.origin + '/u/' + me.username;
  app.innerHTML = `<div class="card"><div class="prof"><label title="Change profile picture">${av(me.avatar, me.username, 64)}<input type="file" id="pic" accept="image/*" hidden></label>
      <div><b>@${esc(me.username)}</b><div class="row" style="margin-top:4px"><button class="small ghost" id="pc">${me.avatar ? 'Change photo' : 'Add photo'}</button>${me.avatar ? '<button class="small ghost" id="pr0">Remove</button>' : ''}</div></div></div>
      <h2>Your link</h2>
      <div class="link"><input readonly value="${esc(link)}" id="lk"><button id="cp">Copy</button></div>
      <p class="note" style="margin-bottom:6px">Put it in your story or bio. Your prompt:</p>
      <div class="link"><input id="pr" maxlength="120" value="${esc(me.prompt)}"><button class="ghost" id="ps">Save</button></div>
      <div class="chips">${PROMPTS.map(p => `<button data-p="${esc(p)}">${esc(p)}</button>`).join('')}</div>
      <details class="pw"><summary>Change password</summary>
        <form id="pwf" style="margin-top:10px"><input type="password" id="pw-old" placeholder="Current password" autocomplete="current-password">
        <input type="password" id="pw-new" placeholder="New password (6+ characters)" autocomplete="new-password">
        <div class="err" id="pw-e"></div><button>Save new password</button></form></details></div>
    <div class="tabs"><button id="t-in" class="${tab==='inbox'?'on':''}">Inbox</button><button id="t-sent" class="${tab==='sent'?'on':''}">Sent</button></div>
    <div id="list"><div class="empty">Loading…</div></div>`;
  $('#cp').onclick = async () => { try { await navigator.clipboard.writeText(link); toast('Link copied'); } catch { $('#lk').select(); toast('Select + copy the link'); } };
  $('#ps').onclick = async () => { try { const d = await call('prompt', { prompt: $('#pr').value }); me.prompt = d.prompt; toast('Prompt saved'); } catch (x) { toast(x.message); } };
  document.querySelector('.chips').onclick = async e => { const b = e.target.closest('button[data-p]'); if (!b) return;
    $('#pr').value = b.dataset.p; try { const d = await call('prompt', { prompt: b.dataset.p }); me.prompt = d.prompt; toast('Prompt set'); } catch (x) { toast(x.message); } };
  $('#pc').onclick = () => $('#pic').click();
  $('#pic').onchange = async e => { const f = e.target.files[0]; if (!f) return;
    try { const d = await call('avatar', { image: await shrinkImage(f) }); me.avatar = d.avatar; toast('Photo updated'); renderWho(); home(); } catch (x) { toast(x.message); } };
  $('#pwf').onsubmit = async e => { e.preventDefault(); $('#pw-e').textContent = '';
    try { await call('password', { old: $('#pw-old').value, new: $('#pw-new').value }); $('#pw-old').value = $('#pw-new').value = ''; $('.pw').open = false; toast('Password changed 🔒'); }
    catch (x) { $('#pw-e').textContent = x.message; } };
  if ($('#pr0')) $('#pr0').onclick = async () => { try { await call('avatar', { image: null }); me.avatar = null; renderWho(); home(); } catch (x) { toast(x.message); } };
  setUnread(me.unread || 0, me.replies || 0);
  checkMilestone();
  $('#t-in').onclick = () => { tab = 'inbox'; home(); };
  $('#t-sent').onclick = () => { tab = 'sent'; home(); };
  loadList();
  clearInterval(poll); poll = setInterval(async () => {
    if (document.hidden || document.querySelector('#list textarea, #list input, .modal')) return;
    try { const c = await call('unread'); Object.assign(me, { received: c.received }); setUnread(c.unread, c.replies); checkMilestone(); } catch {}
    loadList();
  }, 15000);
}

async function loadList(){
  const list = $('#list'); if (!list) return;
  let rows;
  try { rows = await call(tab); } catch (x) { list.innerHTML = `<div class="err">${esc(x.message)}</div>`; return; }
  if (!rows.length) { list.innerHTML = `<div class="empty">${tab==='inbox' ? 'No messages yet — share your link!' : "You haven't sent anything yet."}</div>`; return; }
  const inboxCard = m => m.hidden ? `
    <div class="msg hid" data-id="${m.id}"><div class="row" style="justify-content:space-between;flex-wrap:nowrap">
      <div class="hid-text">${esc(m.body)}</div><button class="small ghost" data-a="unhide">Unhide</button></div></div>` : `
    <div class="msg${m.seen ? '' : ' new'}" data-id="${m.id}">
      <div class="meta">${m.revealed ? av(m.from_avatar, m.from_name, 24) + ' from <b>@' + esc(m.from_name) + '</b>' : 'from <b>anonymous</b>'} · ${ago(m.created_at)}${m.seen ? '' : ' · <b style="color:var(--y2)">new</b>'}</div>
      <div class="text">${esc(m.body)}</div>
      ${m.reply ? `<div class="reply"><b>You:</b> ${esc(m.reply)}</div>` : ''}
      ${!m.revealed && m.guesses.length ? `<div class="note" style="margin-bottom:8px">Your guess: ${m.guesses.map(g => '@' + esc(g)).join(', ')} 🤞</div>` : ''}
      <div class="row"><button class="small" data-a="reply">${m.reply ? 'Edit reply' : 'Reply'}</button>
        <button class="small" data-a="share">Share</button>
        ${!m.revealed && !m.guesses.length ? (m.reply ? '<button class="small ghost" data-a="guess">Guess who 🤔</button>' : '<button class="small ghost" data-a="guesslocked">Guess who 🔒</button>') : ''}
        <button class="small ghost" data-a="hide">Hide</button>
        <button class="small ghost" data-a="delete">Delete</button>
        <button class="small danger" data-a="block">Block sender</button>
        <button class="small danger" data-a="report">Report</button></div>
    </div>`;
  if (tab === 'inbox') {
    const shown = rows.filter(m => !m.hidden), hid = rows.filter(m => m.hidden), replied = shown.filter(m => m.reply).length;
    list.innerHTML = (replied ? `<div class="row tools"><button class="small ghost" data-t="hideall">Hide all replied (${replied})</button></div>` : '')
      + (shown.length ? shown.map(inboxCard).join('') : `<div class="empty">All caught up — everything's hidden ✨</div>`)
      + (hid.length ? `<button class="ghost hid-toggle" data-t="toggle">${showHidden ? 'Hide' : 'Show'} hidden messages (${hid.length})</button>`
        + (showHidden ? hid.map(inboxCard).join('') : '') : '');
  } else list.innerHTML = rows.map(m => `
    <div class="msg${m.reply && !m.reply_seen ? ' new' : ''}" data-id="${m.id}">
      <div class="meta">${av(m.to_avatar, m.to_name, 24)} to <b>@${esc(m.to_name)}</b> · ${ago(m.created_at)} · ${m.revealed ? 'they know it\'s you' : 'anonymous'}</div>
      <div class="receipt ${m.seen ? 'is-seen' : ''}">${m.seen ? '✓✓ Seen' + (m.seen_at ? ' ' + ago(m.seen_at) : '') : '✓ Delivered'}</div>
      <div class="text">${esc(m.body)}</div>
      ${m.reply ? `<div class="reply"><b>@${esc(m.to_name)}${m.reply_seen ? '' : ' replied 💬'}:</b> ${esc(m.reply)}</div>` : ''}
      ${!m.revealed && m.guessed ? `<div class="guessed">👀 @${esc(m.to_name)} guessed it's you!</div>` : ''}
      ${!m.revealed && !m.guessed && m.guess_count ? `<div class="note" style="margin-bottom:8px">They've guessed ${m.guess_count} time${m.guess_count === 1 ? '' : 's'} — not you (yet)</div>` : ''}
      ${m.revealed ? '' : '<div class="row"><button class="small ghost" data-a="reveal">Reveal it\'s me</button></div>'}
    </div>`).join('');
  rowsById = Object.fromEntries(rows.map(m => [m.id, m]));
  if (tab === 'inbox' && rows.some(m => !m.seen)) { try { await call('seen', {}); } catch {} setUnread(0); }
  if (tab === 'sent' && rows.some(m => m.reply && !m.reply_seen)) { try { await call('replies-seen', {}); } catch {} setUnread(me.unread || 0, 0); }
}

let showHidden = false;
$('#app').addEventListener('click', async e => {
  const t = e.target.closest('button[data-t]');
  if (t) {
    if (t.dataset.t === 'toggle') { showHidden = !showHidden; loadList(); return; }
    if (t.dataset.t === 'hideall') { try { await call('hide', { all: 'replied' }); toast('Hid everything you replied to'); loadList(); } catch (x) { toast(x.message); } return; }
  }
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const box = b.closest('.msg'), id = box.dataset.id, a = b.dataset.a;
  if (a === 'reply') {
    if (box.querySelector('textarea')) return;
    box.insertAdjacentHTML('beforeend', `<div style="margin-top:10px"><textarea maxlength="500" placeholder="Your reply…" style="min-height:70px"></textarea><div class="row"><button class="small" data-a="sendreply">Send reply</button><button class="small ghost" data-a="cancel">Cancel</button></div></div>`);
    box.querySelector('textarea').focus(); return;
  }
  if (a === 'cancel') { b.parentElement.parentElement.remove(); return; }
  if (a === 'guesslocked') { toast('Reply to the message first to unlock your guess'); return; }
  if (a === 'guess') {
    if (box.querySelector('.gform')) return;
    box.insertAdjacentHTML('beforeend', `<div class="gform" style="margin-top:10px"><p class="note" style="margin:0 0 6px">You get <b>one</b> guess on this message (and 3 a day in total). You won't be told if you're right — but if you are, they'll find out and can choose to reveal.</p>
      <div class="link"><input placeholder="@username" autocapitalize="none" style="margin:0"><button class="small" data-a="sendguess">Guess</button><button class="small ghost" data-a="cancel">Cancel</button></div></div>`);
    box.querySelector('.gform input').focus(); return;
  }
  if (a === 'share') { shareCard(rowsById[id]); return; }
  if (['block','report','delete','reveal'].includes(a) && !b.dataset.sure) {
    b.dataset.sure = 1; const old = b.textContent; b.textContent = 'Sure?';
    setTimeout(() => { if (b.isConnected) { delete b.dataset.sure; b.textContent = old; } }, 3000); return;
  }
  try {
    if (a === 'sendreply') await call('reply', { id, text: box.querySelector('textarea').value });
    else if (a === 'hide' || a === 'unhide') await call('hide', { id, hidden: a === 'hide' });
    else if (a === 'sendguess') await call('guess', { id, username: box.querySelector('.gform input').value });
    else await call(a, { id });
    toast({ sendguess: 'Guess locked in 🤞', sendreply: 'Reply saved', block: 'Blocked — their messages are gone', report: 'Reported, thanks', delete: 'Deleted', hide: 'Hidden — find it at the bottom', unhide: 'Back in your inbox', reveal: "Revealed — they'll see your name" }[a]);
    loadList();
  } catch (x) { toast(x.message); }
});

// ---------- share card: message + reply as a story image ----------
let rowsById = {};
function wrapLines(g, text, maxW){
  const out = [];
  for (const para of String(text).split('\n')) {
    let line = '';
    for (const w of para.split(' ')) {
      const t = line ? line + ' ' + w : w;
      if (g.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t;
    }
    out.push(line);
  }
  return out;
}
async function shareCard(m){
  if (!m) return;
  try { await document.fonts.load('800 60px Rubik'); await document.fonts.load('600 40px Rubik'); } catch {}
  const W = 1080, H = 1920, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const bg = g.createLinearGradient(0, 0, W, H); bg.addColorStop(0, '#ec1187'); bg.addColorStop(.5, '#ff5f6d'); bg.addColorStop(1, '#ffa94d');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r); };
  // message card
  g.font = '600 68px Rubik, sans-serif';
  const msgLines = wrapLines(g, m.body, 700).slice(0, 10);
  g.font = '400 54px Rubik, sans-serif';
  const repLines = m.reply ? wrapLines(g, m.reply, 720).slice(0, 8) : [];
  const cardH = 170 + msgLines.length * 86 + (repLines.length ? 80 + repLines.length * 70 : 0);
  const top = Math.max(260, (H - cardH) / 2 - 80);
  g.fillStyle = 'rgba(0,0,0,.18)'; rr(110, top + 16, 860, cardH, 56); g.fill();
  g.fillStyle = '#fff'; rr(110, top, 860, cardH, 56); g.fill();
  g.fillStyle = '#111'; rr(150, top + 40, 780, 80 + msgLines.length * 86, 40); g.fill();
  g.fillStyle = '#fff'; g.font = '600 68px Rubik, sans-serif';
  msgLines.forEach((l, i) => g.fillText(l, 190, top + 132 + i * 86));
  if (repLines.length) {
    const ry = top + 120 + msgLines.length * 86 + 80;
    g.fillStyle = '#ff5f6d'; g.fillRect(160, ry - 50, 10, repLines.length * 70 + 10);
    g.fillStyle = '#111'; g.font = '400 54px Rubik, sans-serif';
    repLines.forEach((l, i) => g.fillText(l, 195, ry + i * 70));
  }
  // header + footer
  g.fillStyle = '#fff'; g.textAlign = 'center';
  g.font = '800 96px Rubik, sans-serif'; g.fillText('wyspr', W / 2, 190);
  g.font = '600 52px Rubik, sans-serif'; g.fillText(m.revealed ? 'from @' + m.from_name : 'from anonymous 🤫', W / 2, top - 50);
  g.font = '600 46px Rubik, sans-serif'; g.fillText('send me anonymous messages 👇', W / 2, H - 260);
  const link = location.host + '/u/' + me.username; let fs = 56;
  do { g.font = `800 ${fs}px Rubik, sans-serif`; fs -= 2; } while (g.measureText(link).width > W - 120 && fs > 20);
  g.fillText(link, W / 2, H - 180);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const url = URL.createObjectURL(blob);
  const file = new File([blob], 'wyspr.png', { type: 'image/png' });
  const canShare = navigator.canShare && navigator.canShare({ files: [file] });
  document.body.insertAdjacentHTML('beforeend', `<div class="modal"><div class="card" style="margin:0">
    <img src="${url}" alt="Share card preview" style="width:100%;max-height:60vh;object-fit:contain;border-radius:14px;margin-bottom:12px">
    <div class="row">${canShare ? '<button id="sh-go">Share</button>' : ''}<a href="${url}" download="wyspr.png"><button class="${canShare ? 'ghost' : ''}" type="button">Download</button></a>
    <button class="ghost" id="sh-x">Close</button></div>
    <p class="note">Post it to your story with your link so people can send you more.</p></div></div>`);
  const close = () => { document.querySelector('.modal')?.remove(); URL.revokeObjectURL(url); };
  $('#sh-x').onclick = close;
  document.querySelector('.modal').onclick = e => { if (e.target.classList.contains('modal')) close(); };
  if (canShare) $('#sh-go').onclick = async () => { try { await navigator.share({ files: [file], text: 'send me anonymous messages: ' + location.origin + '/u/' + me.username }); } catch {} };
}

// ---------- admin panel (only @nugget; the server checks too) ----------
let aTab = 'users', aUser = '', aReported = false;
async function adminPage(){
  clearInterval(poll);
  document.querySelector('.wrap').classList.add('wide');
  let stats = {};
  try { stats = await call('admin/stats'); } catch (x) { app.innerHTML = `<div class="card err">${esc(x.message)}</div>`; return; }
  app.innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Admin</h2><a href="/"><button class="small ghost">Back to inbox</button></a></div>
      <div class="stats">${[['Users',stats.users],['Messages',stats.messages],['Last 24h',stats.messages_24h],['Reports',stats.reports],['Banned',stats.banned]]
        .map(([k,v]) => `<div><b>${esc(v)}</b><span>${k}</span></div>`).join('')}</div></div>
    <div class="tabs"><button id="a-u" class="${aTab==='users'?'on':''}">Users</button><button id="a-m" class="${aTab==='messages'?'on':''}">Messages</button></div>
    <div class="card" id="alist"><div class="empty">Loading…</div></div>`;
  $('#a-u').onclick = () => { aTab = 'users'; adminPage(); };
  $('#a-m').onclick = () => { aTab = 'messages'; adminPage(); };
  aTab === 'users' ? adminUsers() : adminMessages();
}
async function adminUsers(){
  const box = $('#alist'); let rows;
  try { rows = await call('admin/users'); } catch (x) { box.innerHTML = `<div class="err">${esc(x.message)}</div>`; return; }
  box.innerHTML = `<input id="us" placeholder="Search users…"><div class="scroll"><table class="at"><thead><tr><th>User</th><th>Joined</th><th>Sent</th><th>Got</th><th>Reported</th><th></th></tr></thead><tbody>${
    rows.map(u => `<tr data-u="${esc(u.username)}"><td>${av(u.avatar, u.username, 28)} <b>@${esc(u.username)}</b>${u.banned ? ' <span class="tag">banned</span>' : ''}<div class="note">${esc(u.prompt)}</div></td>
      <td>${ago(u.created_at)}</td><td class="n">${u.sent}</td><td class="n">${u.received}</td><td class="n">${u.reported}</td>
      <td><div class="row"><button class="small ghost" data-x="view">Messages</button>${u.username === me.username ? '' :
        `<button class="small ghost" data-x="resetpw">Reset password</button><button class="small danger" data-x="${u.banned ? 'unban' : 'ban'}">${u.banned ? 'Unban' : 'Ban'}</button>`}</div></td></tr>`).join('')}</tbody></table></div>`;
  $('#us').oninput = e => { const s = e.target.value.toLowerCase(); box.querySelectorAll('tbody tr').forEach(tr => tr.style.display = tr.dataset.u.includes(s) ? '' : 'none'); };
  box.onclick = async e => {
    const b = e.target.closest('button[data-x]'); if (!b) return;
    const name = b.closest('tr').dataset.u, x = b.dataset.x;
    if (x === 'view') { aTab = 'messages'; aUser = name; aReported = false; return adminPage(); }
    if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'Sure?'; return; }
    if (x === 'resetpw') {
      b.textContent = 'Reset password'; delete b.dataset.sure;
      document.body.insertAdjacentHTML('beforeend', `<div class="modal"><div class="card" style="margin:0"><h2>Reset password for @${esc(name)}</h2>
        <form id="rpf"><input id="tp" placeholder="New password (leave blank for a random one)" autocomplete="off">
        <div class="err" id="tp-e"></div><div class="row"><button>Set password</button><button type="button" class="ghost" id="tp-x">Cancel</button></div></form></div></div>`);
      const close = () => document.querySelector('.modal').remove();
      $('#tp-x').onclick = close;
      $('#rpf').onsubmit = async e => {
        e.preventDefault(); $('#tp-e').textContent = '';
        try { const d = await call('admin/resetpw', { username: name, password: $('#tp').value });
          document.querySelector('.modal .card').innerHTML = `<h2>New password for @${esc(name)}</h2>
            <p class="note">Send this to them. It works right away, and they can change it under "Change password" once they're in. They've been logged out everywhere.</p>
            <div class="link"><input readonly value="${esc(d.temp)}" id="tp2"><button id="tp-c">Copy</button></div>
            <div class="row" style="margin-top:12px"><button class="ghost" id="tp-d">Done</button></div>`;
          $('#tp-c').onclick = async () => { try { await navigator.clipboard.writeText(d.temp); toast('Copied'); } catch { $('#tp2').select(); } };
          $('#tp-d').onclick = close;
        } catch (x2) { $('#tp-e').textContent = x2.message; }
      };
      $('#tp').focus();
      return;
    }
    try { await call('admin/ban', { username: name, ban: x === 'ban' }); toast(x === 'ban' ? `Banned @${name}` : `Unbanned @${name}`); adminPage(); } catch (x2) { toast(x2.message); }
  };
}
async function adminMessages(){
  const box = $('#alist'); let rows;
  try { rows = await call('admin/messages', { user: aUser, reported: aReported }); } catch (x) { box.innerHTML = `<div class="err">${esc(x.message)}</div>`; return; }
  box.innerHTML = `<div class="row" style="margin-bottom:10px"><input id="mu" style="margin:0;flex:1" placeholder="Filter by username (from or to)" value="${esc(aUser)}">
      <label class="check" style="margin:0"><input type="checkbox" id="mr" ${aReported ? 'checked' : ''}> Reported only</label></div>
    ${rows.length ? rows.map(m => `<div class="msg" data-id="${m.id}">
      <div class="meta"><b>@${esc(m.from_name)}</b> → <b>@${esc(m.to_name)}</b> · ${ago(m.created_at)} · ${m.revealed ? 'revealed' : 'anonymous to them'}${Number(m.reports) ? ` · <span class="tag">${m.reports} report${m.reports == 1 ? '' : 's'}</span>` : ''}</div>
      <div class="text">${esc(m.body)}</div>
      ${m.reply ? `<div class="reply"><b>@${esc(m.to_name)}:</b> ${esc(m.reply)}</div>` : ''}
      <div class="row"><button class="small danger" data-x="del">Delete message</button><button class="small danger" data-x="ban" data-n="${esc(m.from_name)}">Ban @${esc(m.from_name)}</button></div></div>`).join('')
      : '<div class="empty">No messages match.</div>'}`;
  let t; $('#mu').oninput = e => { clearTimeout(t); t = setTimeout(() => { aUser = e.target.value.trim().toLowerCase().replace(/^@/, ''); adminMessages(); }, 400); };
  $('#mr').onchange = e => { aReported = e.target.checked; adminMessages(); };
  box.onclick = async e => {
    const b = e.target.closest('button[data-x]'); if (!b) return;
    if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'Sure?'; return; }
    try {
      if (b.dataset.x === 'del') { await call('admin/delete', { id: b.closest('.msg').dataset.id }); toast('Deleted'); }
      else { await call('admin/ban', { username: b.dataset.n, ban: true }); toast(`Banned @${b.dataset.n}`); }
      adminMessages();
    } catch (x) { toast(x.message); }
  };
}

// ---------- start ----------
(async () => {
  if (token) { try { me = await call('me'); } catch { me = null; } }
  renderWho();
  const m = location.pathname.match(/^\/u\/([^/]+)/);
  if (m) sendPage(decodeURIComponent(m[1]));
  else if (location.pathname.startsWith('/admin') && me && me.admin) adminPage();
  else if (me) home();
  else authForm('Get anonymous messages from your friends', home);
})();
}
